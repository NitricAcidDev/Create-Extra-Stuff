plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id
base.archivesName = "create-tfmg-aviation-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets { verification }

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://mvn.devos.one/snapshots' }
}

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.verification
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/verification')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'createtfmgaviation'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.verification)
        }
    }
}

dependencies {
    // Only needed for development runs; dependencies are never bundled in the addon.
    runtimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    runtimeOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    runtimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")
    runtimeOnly fileTree('dev-libs') { include '*.jar' }
    verificationImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    verificationImplementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    verificationImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
}

tasks.named('processResources', ProcessResources) {
    def metadata = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                    mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties(metadata)
    filesMatching('META-INF/neoforge.mods.toml') { expand(metadata) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

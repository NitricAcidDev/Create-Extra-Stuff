plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id
base.archivesName = "create-trains-interactive-${minecraft_version}"
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets { verification }
sourceSets.main.resources.srcDir 'src/generated/resources'
configurations.verificationImplementation.extendsFrom configurations.implementation, configurations.compileOnly

repositories {
    maven { url = 'https://maven.createmod.net'; content { includeGroup 'com.simibubi.create'; includeGroup 'net.createmod.ponder'; includeGroup 'dev.engine-room.flywheel' } }
    maven { url = 'https://mvn.devos.one/snapshots'; content { includeGroup 'com.tterrag.registrate' } }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'; content { includeGroup 'software.bernie.geckolib' } }
}

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.verification
    runs {
        client {
            client()
            systemProperty 'create_trains_interactive.verifyInspector', project.findProperty('verifyInspector') ?: 'false'
        }
        server { server(); programArgument '--nogui' }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/verification')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'create_trains_interactive'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.verification)
        }
    }
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly 'maven.modrinth:moonlight:1.21-2.20.0-neoforge'
    compileOnly 'maven.modrinth:every-compat:1.21-2.11.4-neoforge'
    compileOnly 'maven.modrinth:stone-zone:1.21-2.11.3-neoforge'
    compileOnly 'maven.modrinth:handcrafted:4.0.3-neoforge'
    compileOnly 'maven.modrinth:ars-nouveau:5.10.5-neoforge'
    compileOnly 'software.bernie.geckolib:geckolib-forge-1.21.1:4.8.2'
    compileOnly 'maven.modrinth:woodworks:4.0.2-neoforge'
    compileOnly 'maven.modrinth:blueprint:8.0.7-neoforge'
    compileOnly 'maven.modrinth:iron-chests:1.21-neoforge-16.0.7'
    compileOnly 'maven.modrinth:iron-shulker-boxes:1.21-neoforge-7.0.1'
    compileOnly 'maven.modrinth:create-storage-neo-forge:1.1.4-neoforge'
    compileOnly fileTree('dev-libs') { include 'kaleidoscopetavern-*.jar' }
    compileOnly fileTree('dev-libs') { include 'bookshelfinspector-neoforge-2.4+1.21.1.jar' }
    runtimeOnly fileTree('dev-libs') {
        include '*.jar'
        if (project.hasProperty('withoutInspector')) exclude 'bookshelfinspector-*.jar'
    }
    verificationImplementation sourceSets.main.output
    if (project.hasProperty('withOnTheMove'))
        runtimeOnly fileTree('dev-libs/on-the-move') { include '*.jar' }
}

tasks.named('processResources', ProcessResources) {
    def metadata = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                    mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties(metadata)
    filesMatching('META-INF/neoforge.mods.toml') { expand(metadata) }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

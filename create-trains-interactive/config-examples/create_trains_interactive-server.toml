# Server-side rules for placing and breaking blocks on Create contraptions.
# Active when Create: On the Move is installed. Includes creative players.
# Normal use of existing blocks is unaffected.
restrictTrainEditing = true

# Portable bottles, glassware, drinks, shakers and cooking/serving blocks.
# Cabinets, furniture, racks, freezers and brewing barrels stay protected.
allowPortableServiceBlocks = true

# Optional action-bar warning for rejected edits; quiet by default.
showEditingWhitelistMessages = false

# Additional exact block IDs or namespace:* entries.
# Disable portable service blocks and empty this list to prevent all editing.
allowedTrainBlocks = ["minecraft:furnace", "minecraft:smoker", "minecraft:campfire", "minecraft:soul_campfire"]
